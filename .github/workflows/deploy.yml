name: Build & deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  schedule:
    # Rebuild the article data every 30 minutes (GitHub may delay scheduled runs)
    - cron: '7,37 * * * *'
  workflow_dispatch:

concurrency:
  group: pages-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # Exits non-zero if the fetch looks broken, which skips the deploy
      - run: node scripts/build.js

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=ressec-news --branch=main
